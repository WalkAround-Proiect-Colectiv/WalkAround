spring:
  application:
    name: routing-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: ${CONSUMER_GROUP_ID}
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: info

app:
  login:
    signing-secret: ${JWT_SIGNING_SECRET:}
    issuer: ${JWT_ISSUER:walkaround}
    audience: ${JWT_AUDIENCE:walkaround-api}
  valhalla:
    url: ${VALHALLA_URL}
    language: ${VALHALLA_LANGUAGE:en-US}
  routing:
    h3-resolution: ${H3_RESOLUTION:11}
    danger-zones-size-limit: ${DANGER_ZONES_LIMIT:50}
    extra-radius: ${EXTRA_RADIUS:0.02}