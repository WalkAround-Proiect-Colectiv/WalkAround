spring:
  application:
    name: realtime-service

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${CONSUMER_GROUP_ID}
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health, info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

  info:
    env:
      enabled: true

info:
  microservice:
    name: Realtime Service
    description: Service responsible for realtime communication with the client

logging:
  level:
    root: info

