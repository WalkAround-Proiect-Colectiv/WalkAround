spring:
  servlet:
    multipart:
      max-file-size: ${PROFILE_PICTURE_MAX_BYTES:5242880}B
      max-request-size: ${PROFILE_PICTURE_REQUEST_MAX_BYTES:6291456}B
  application:
    name: application-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${CONSUMER_GROUP_ID}
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health, info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

  info:
    env:
      enabled: true

info:
  microservice:
    name: Application API
    description: The main service of the application

logging:
  level:
    root: info

app:
  place-search:
    provider: ${PLACE_SEARCH_PROVIDER:photon}
    base-url: ${PLACE_SEARCH_BASE_URL:https://photon.komoot.io}
    timeout: ${PLACE_SEARCH_TIMEOUT:PT10S}
    max-results: ${PLACE_SEARCH_MAX_RESULTS:5}
  profile:
    picture-max-bytes: ${PROFILE_PICTURE_MAX_BYTES:5242880}
    picture-max-pixels: ${PROFILE_PICTURE_MAX_PIXELS:16000000}
    picture-output-size: ${PROFILE_PICTURE_OUTPUT_SIZE:512}
  login:
    signing-secret: ${JWT_SIGNING_SECRET:}
    issuer: ${JWT_ISSUER:walkaround}
    audience: ${JWT_AUDIENCE:walkaround-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:${REGISTRATION_ALLOWED_ORIGINS:}}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-name: ${AUTH_COOKIE_NAME:walkaround_refresh}
  registration:
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers: https://accounts.google.com,accounts.google.com
    allowed-origins: ${REGISTRATION_ALLOWED_ORIGINS:}
  events:
    provider: ${EVENTS_PROVIDER:serpapi}
    serp-api-key: ${EVENTS_SERP_API_KEY:}
    cache-ttl: ${EVENTS_CACHE_TTL:PT24H}
    time-zone: ${EVENTS_TIME_ZONE:Europe/Bucharest}
    nominatim-user-agent: ${EVENTS_NOMINATIM_USER_AGENT:WalkAround-university-project/1.0 (upcoming events)}
    reminders-enabled: ${EVENTS_REMINDERS_ENABLED:true}
    reminder-topic: ${EVENTS_REMINDER_TOPIC:event-reminders-topic}
    details-enabled: ${EVENTS_DETAILS_ENABLED:true}
    details-cache-ttl: ${EVENTS_DETAILS_CACHE_TTL:P7D}
    details-failure-ttl: ${EVENTS_DETAILS_FAILURE_TTL:PT1H}
    details-timeout: ${EVENTS_DETAILS_TIMEOUT:PT8S}
  routing-service:
    url: ${ROUTING_SERVICE_URL}

  trip-plan:
    city-provider: ${CITY_PROVIDER:geonames}
    geonames-username: ${GEONAMES_USERNAME}
    city-autocomplete-max-results: ${CITY_AUTOCOMPLETE_MAX_RESULTS:10}
    geonames-base-url: ${GEONAMES_BASE_URL:https://secure.geonames.org}
    geonames-timeout: ${GEONAMES_TIMEOUT:PT3S}
    flight-provider: ${FLIGHT_PROVIDER:serpapi}
    serp-api-key: ${SERP_API_KEY:}
    flight-search-max-results: ${FLIGHT_SEARCH_MAX_RESULTS:3}
    serp-api-base-url: ${SERP_API_BASE_URL:https://serpapi.com}
    serp-api-timeout: ${SERP_API_TIMEOUT:PT15S}
    flight-search-max-date-range-days: ${FLIGHT_SEARCH_MAX_DATE_RANGE_DAYS:7}
    flight-search-max-arrival-offset-days: ${FLIGHT_SEARCH_MAX_ARRIVAL_OFFSET_DAYS:2}
    accommodation-provider: ${ACCOMMODATION_PROVIDER:serpapi}
    accommodation-search-max-results: ${ACCOMMODATION_SEARCH_MAX_RESULTS:3}
    attraction-provider: ${ATTRACTION_PROVIDER:serpapi}
    safety-provider: ${SAFETY_PROVIDER:travel-risk-api}
    travel-risk-api-key: ${TRAVEL_RISK_API_KEY:}
    travel-risk-api-base-url: ${TRAVEL_RISK_API_BASE_URL:https://api.travelriskapi.com}
    travel-risk-api-timeout: ${TRAVEL_RISK_API_TIMEOUT:PT8S}
    safety-nearby-radius-km: ${SAFETY_NEARBY_RADIUS_KM:100}
    safety-max-results: ${SAFETY_MAX_RESULTS:10}
    news-provider: ${NEWS_PROVIDER:currents}
    currents-api-key: ${CURRENTS_API_KEY:}
    currents-api-base-url: ${CURRENTS_API_BASE_URL:https://api.currentsapi.services}
    currents-api-timeout: ${CURRENTS_API_TIMEOUT:PT8S}
    news-page-size: ${NEWS_PAGE_SIZE:20}
    weather-provider: ${WEATHER_PROVIDER:open-meteo}
    open-meteo-base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
    open-meteo-timeout: ${OPEN_METEO_TIMEOUT:PT8S}
    weather-forecast-days: ${WEATHER_FORECAST_DAYS:14}
    open-meteo-archive-base-url: ${OPEN_METEO_ARCHIVE_BASE_URL:https://archive-api.open-meteo.com}
    weather-history-years: ${WEATHER_HISTORY_YEARS:3}

recommendation:
  default-radius-meters: ${RECOMMENDATION_DEFAULT_RADIUS_METERS:2000}
  max-radius-meters: ${RECOMMENDATION_MAX_RADIUS_METERS:5000}
  default-limit: ${RECOMMENDATION_DEFAULT_LIMIT:15}
  max-limit: ${RECOMMENDATION_MAX_LIMIT:50}
  cache-ttl: ${RECOMMENDATION_CACHE_TTL:PT15M}
  open-meteo-base-url: ${OPEN_METEO_BASE_URL:https://api.open-meteo.com}
  open-meteo-timeout: ${OPEN_METEO_TIMEOUT:PT5S}
  poi-database-url: ${POI_DATABASE_URL:}
  poi-database-username: ${POI_DATABASE_USERNAME:map_tiles}
  poi-database-password: ${POI_DATABASE_PASSWORD:}
