spring:
  application:
    name: application-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${CONSUMER_GROUP_ID}
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health, info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

  info:
    env:
      enabled: true

info:
  microservice:
    name: Application API
    description: The main service of the application

logging:
  level:
    root: info

app:
  login:
    signing-secret: ${JWT_SIGNING_SECRET:}
    issuer: ${JWT_ISSUER:walkaround}
    audience: ${JWT_AUDIENCE:walkaround-api}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:P30D}
    allowed-origins: ${AUTH_ALLOWED_ORIGINS:${REGISTRATION_ALLOWED_ORIGINS:}}
    cookie-secure: ${AUTH_COOKIE_SECURE:true}
    cookie-name: ${AUTH_COOKIE_NAME:walkaround_refresh}
  registration:
    google:
      client-ids: ${GOOGLE_CLIENT_IDS:}
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers: https://accounts.google.com,accounts.google.com
    allowed-origins: ${REGISTRATION_ALLOWED_ORIGINS:}

  trip-plan:
    city-provider: ${CITY_PROVIDER:geonames}
    geonames-username: ${GEONAMES_USERNAME}
    city-autocomplete-max-results: ${CITY_AUTOCOMPLETE_MAX_RESULTS:10}
    geonames-base-url: ${GEONAMES_BASE_URL:https://secure.geonames.org}
    geonames-timeout: ${GEONAMES_TIMEOUT:PT3S}
    flight-provider: ${FLIGHT_PROVIDER:serpapi}
    serp-api-key: ${SERP_API_KEY:}
    flight-search-max-results: ${FLIGHT_SEARCH_MAX_RESULTS:3}
    serp-api-base-url: ${SERP_API_BASE_URL:https://serpapi.com}
    serp-api-timeout: ${SERP_API_TIMEOUT:PT15S}
    flight-search-max-date-range-days: ${FLIGHT_SEARCH_MAX_DATE_RANGE_DAYS:7}
    accommodation-provider: ${ACCOMMODATION_PROVIDER:serpapi}
    accommodation-search-max-results: ${ACCOMMODATION_SEARCH_MAX_RESULTS:3}
    attraction-provider: ${ATTRACTION_PROVIDER:serpapi}
    safety-provider: ${SAFETY_PROVIDER:travel-risk-api}
    travel-risk-api-key: ${TRAVEL_RISK_API_KEY:}
    travel-risk-api-base-url: ${TRAVEL_RISK_API_BASE_URL:https://api.travelriskapi.com}
    travel-risk-api-timeout: ${TRAVEL_RISK_API_TIMEOUT:PT8S}
    safety-nearby-radius-km: ${SAFETY_NEARBY_RADIUS_KM:100}
    safety-max-results: ${SAFETY_MAX_RESULTS:10}
    news-provider: ${NEWS_PROVIDER:currents}
    currents-api-key: ${CURRENTS_API_KEY:}
    currents-api-base-url: ${CURRENTS_API_BASE_URL:https://api.currentsapi.services}
    currents-api-timeout: ${CURRENTS_API_TIMEOUT:PT8S}
    news-page-size: ${NEWS_PAGE_SIZE:20}
