spring:
  application:
    name: application-api

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${CONSUMER_GROUP_ID}
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT}

management:
  endpoints:
    web:
      exposure:
        include: health, info

  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never

  info:
    env:
      enabled: true

info:
  microservice:
    name: Application API
    description: The main service of the application

logging:
  level:
    root: info