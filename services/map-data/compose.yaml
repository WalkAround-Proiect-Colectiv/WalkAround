name: walkaround-map

x-database-client: &database-client
  PGHOST: map-db
  PGPORT: "5432"
  PGDATABASE: map
  PGUSER: map_import
  PGPASSWORD: ${MAP_IMPORT_PASSWORD:?Set MAP_IMPORT_PASSWORD}

services:
  map-db:
    image: postgis/postgis:17-3.5
    mem_limit: ${MAP_DB_MEMORY_LIMIT:-3g}
    cpus: ${MAP_DB_CPU_LIMIT:-3.0}
    environment:
      POSTGRES_DB: map
      POSTGRES_USER: map_admin
      POSTGRES_PASSWORD: ${MAP_DB_ADMIN_PASSWORD:?Set MAP_DB_ADMIN_PASSWORD}
      MAP_IMPORT_PASSWORD: ${MAP_IMPORT_PASSWORD:?Set MAP_IMPORT_PASSWORD}
      MAP_TILES_PASSWORD: ${MAP_TILES_PASSWORD:?Set MAP_TILES_PASSWORD}
    ports:
      - "127.0.0.1:${MAP_DB_HOST_PORT:-5435}:5432"
    volumes:
      - map-db-data:/var/lib/postgresql/data
      - ./database/init.sh:/docker-entrypoint-initdb.d/20-map-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U map_admin -d map"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  map-job:
    build: ./importer
    profiles: [maintenance]
    mem_limit: ${MAP_JOB_MEMORY_LIMIT:-3g}
    cpus: ${MAP_JOB_CPU_LIMIT:-2.0}
    environment:
      <<: *database-client
      OSM_EXTRACT_URL: ${OSM_EXTRACT_URL:-https://download.geofabrik.de/europe/romania-latest.osm.pbf}
      OSM_REPLICATION_URL: ${OSM_REPLICATION_URL:-https://download.geofabrik.de/europe/romania-updates}
      OSM_INPUT: ${OSM_INPUT:-/data/region.osm.pbf}
      OSM_CACHE_MB: ${OSM_CACHE_MB:-512}
      OSM_PROCESSES: ${OSM_PROCESSES:-2}
    volumes:
      - map-downloads:/data
      - map-locks:/locks
      - ./importer:/workspace/importer:ro
      - ./tests:/workspace/tests:ro
    entrypoint: [bash, /workspace/importer/run.sh]
    command: [status]
    depends_on:
      map-db:
        condition: service_healthy

  map-schema:
    image: postgis/postgis:17-3.5
    mem_limit: ${MAP_SCHEMA_MEMORY_LIMIT:-128m}
    cpus: ${MAP_SCHEMA_CPU_LIMIT:-0.5}
    environment:
      PGHOST: map-db
      PGPORT: "5432"
      PGDATABASE: map
      PGUSER: map_admin
      PGPASSWORD: ${MAP_DB_ADMIN_PASSWORD:?Set MAP_DB_ADMIN_PASSWORD}
    entrypoint: [psql]
    command: [-X, -v, ON_ERROR_STOP=1, -c, "CREATE SCHEMA IF NOT EXISTS places AUTHORIZATION map_import;"]
    depends_on:
      map-db:
        condition: service_healthy

  map-migrate:
    image: flyway/flyway:13.12.0-alpine
    mem_limit: ${MAP_MIGRATE_MEMORY_LIMIT:-768m}
    cpus: ${MAP_MIGRATE_CPU_LIMIT:-1.0}
    environment:
      FLYWAY_URL: jdbc:postgresql://map-db:5432/map
      FLYWAY_USER: map_import
      FLYWAY_PASSWORD: ${MAP_IMPORT_PASSWORD:?Set MAP_IMPORT_PASSWORD}
      FLYWAY_DEFAULT_SCHEMA: tiles
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_CONNECT_RETRIES: "10"
    volumes:
      - ./database/migrations:/flyway/sql:ro
    command: migrate
    depends_on:
      map-schema:
        condition: service_completed_successfully

  martin:
    build: ./martin
    mem_limit: ${MARTIN_MEMORY_LIMIT:-512m}
    cpus: ${MARTIN_CPU_LIMIT:-1.0}
    environment:
      MAP_DATABASE_URL: postgresql://map_tiles:${MAP_TILES_PASSWORD:?Set MAP_TILES_PASSWORD}@map-db:5432/map
    command: [--config, /etc/martin/config.yaml]
    volumes:
      - ./martin.yaml:/etc/martin/config.yaml:ro
    depends_on:
      map-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  map-gateway:
    image: nginx:1.28-alpine
    mem_limit: ${MAP_GATEWAY_MEMORY_LIMIT:-128m}
    cpus: ${MAP_GATEWAY_CPU_LIMIT:-0.5}
    ports:
      - "${MAP_BIND_ADDRESS:-127.0.0.1}:${MAP_TILES_PORT:-3001}:8080"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/style.json:/usr/share/nginx/html/style.json:ro
    depends_on:
      martin:
        condition: service_started
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  map-db-data:
    name: ${MAP_VOLUME_PREFIX:-walkaround-map}_map-db-data
  map-downloads:
    name: ${MAP_VOLUME_PREFIX:-walkaround-map}_map-downloads
  map-locks:
    name: ${MAP_VOLUME_PREFIX:-walkaround-map}_map-locks
