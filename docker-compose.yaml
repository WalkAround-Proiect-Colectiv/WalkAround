include:
  - path: services/map-data/compose.yaml
    env_file: ${MAP_DATA_ENV_FILE_LOCATION:-services/map-data/.env}

services:
  application-api-db:
    image: postgres:18
    container_name: application-api-db
    mem_limit: ${APPLICATION_API_DB_MEMORY_LIMIT:-1g}
    cpus: ${APPLICATION_API_DB_CPU_LIMIT:-1.0}
    env_file:
      - "${APPLICATION_API_DB_ENV_FILE_LOCATION}"
    ports:
      - "${APPLICATION_API_DB_HOST_PORT}:${APPLICATION_API_DB_CONTAINER_PORT}"
    volumes:
      - application-api-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  routing-api-db:
    image: postgres:18
    container_name: routing-api-db
    mem_limit: ${ROUTING_API_DB_MEMORY_LIMIT:-1g}
    cpus: ${ROUTING_API_DB_CPU_LIMIT:-1.0}
    env_file:
      - "${ROUTING_API_DB_ENV_FILE_LOCATION}"
    ports:
      - "${ROUTING_API_DB_HOST_PORT}:${ROUTING_API_DB_CONTAINER_PORT}"
    volumes:
      - routing-api-db-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: walkaround-valhalla
    mem_limit: ${VALHALLA_MEMORY_LIMIT:-5g}
    cpus: ${VALHALLA_CPU_LIMIT:-4.0}
    ports:
      - "${VALHALLA_HOST_PORT}:${VALHALLA_CONTAINER_PORT}"
    environment:
      - tile_urls=https://download.geofabrik.de/europe/romania-latest.osm.pbf
      - serve_tiles=True
      - server_threads=${VALHALLA_SERVER_THREADS:-2}
    volumes:
      - valhalla-data:/custom_files

  piper:
    build:
      context: ./services/tts
      args:
        PIPER_VOICE: ${PIPER_VOICE}
    container_name: walkaround-piper
    ports:
      - "127.0.0.1:${PIPER_HOST_PORT}:${PIPER_CONTAINER_PORT}"
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.1
    container_name: kafka
    mem_limit: ${KAFKA_MEMORY_LIMIT:-1536m}
    cpus: ${KAFKA_CPU_LIMIT:-2.0}
    ports:
      - "${KAFKA_HOST_PORT}:${KAFKA_CONTAINER_PORT}"
    env_file:
      - "${KAFKA_ENV_FILE_LOCATION}"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  application-api-db-data:
  kafka-data:
  routing-api-db-data:
  valhalla-data:
